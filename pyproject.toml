[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "pyyaml>=6.0",
    "mcp>=1.9",
    "uvicorn>=0.30",
    "qclaudecodesettingeditorwidget @ git+https://github.com/JuyeongYi/QClaudeCodeSettingEditorWidget.git",
]

[project.scripts]
daedalus = "daedalus.__main__:main"
daedalus-bb = "daedalus.cli.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# flat-layout 자동 탐색은 저장소 루트의 project/(실프로젝트 데이터 폴더)를
# 패키지로 오인해 빌드를 거부한다 — 배포 대상은 daedalus 패키지뿐임을 명시.
[tool.setuptools.packages.find]
include = ["daedalus*"]

# 시작 템플릿(A7)은 .py가 아니라 데이터 파일이라 명시하지 않으면 휠에서 빠진다 —
# 그러면 설치본에서만 "템플릿에서 새 프로젝트"가 조용히 실패한다.
[tool.setuptools.package-data]
daedalus = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# 설정 편집 위젯은 **항상 main 최신**을 받는다 (사용자 확정 2026-09-20) — uv lock/sync/run이
# 잠금의 고정 커밋을 무시하고 매번 이 패키지만 다시 해소한다.
upgrade-package = ["qclaudecodesettingeditorwidget"]
