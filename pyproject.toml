[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "pyyaml>=6.0",
    # 앱 내장 MCP 서버 (WP-MCP) — GUI가 켜질 때 함께 뜬다.
    # 1.x(FastMCP)와 2.x(MCPServer) 양쪽을 service._server_factory가 흡수한다.
    "mcp>=1.9",
    "uvicorn>=0.30",
]

[project.scripts]
daedalus = "daedalus.__main__:main"
daedalus-bb = "daedalus.cli.blackboard:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# flat-layout 자동 탐색은 저장소 루트의 project/(실프로젝트 데이터 폴더)를
# 패키지로 오인해 빌드를 거부한다 — 배포 대상은 daedalus 패키지뿐임을 명시.
[tool.setuptools.packages.find]
include = ["daedalus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
