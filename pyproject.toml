[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "pyyaml>=6.0",
    # 앱 내장 MCP 서버 (WP-MCP) — GUI가 켜질 때 함께 뜬다.
    # 1.x(FastMCP)와 2.x(MCPServer) 양쪽을 service._server_factory가 흡수한다.
    "mcp>=1.9",
    "uvicorn>=0.30",
    # 작업 폴더 설정 편집 위젯 (WP-WS) — uv tool install 등 배포 설치가 GitHub에서
    # 함께 받는다. 개발 환경은 external/ 서브모듈의 editable 설치가 이것을 덮는다
    # (나중에 설치한 쪽이 이긴다). 서브모듈 SHA와 이 참조(main 추적)는 별개라
    # 서브모듈을 올릴 때 배포도 최신을 받는지 확인할 것.
    "qclaudecodesettingeditorwidget @ git+https://github.com/JuyeongYi/QClaudeCodeSettingEditorWidget.git",
]

[project.scripts]
daedalus = "daedalus.__main__:main"
daedalus-bb = "daedalus.cli.blackboard:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# flat-layout 자동 탐색은 저장소 루트의 project/(실프로젝트 데이터 폴더)를
# 패키지로 오인해 빌드를 거부한다 — 배포 대상은 daedalus 패키지뿐임을 명시.
[tool.setuptools.packages.find]
include = ["daedalus*"]

# 시작 템플릿(A7)은 .py가 아니라 데이터 파일이라 명시하지 않으면 휠에서 빠진다 —
# 그러면 설치본에서만 "템플릿에서 새 프로젝트"가 조용히 실패한다.
[tool.setuptools.package-data]
daedalus = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
