[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "pyyaml>=6.0",
    # 앱 내장 MCP 서버 (WP-MCP) — GUI가 켜질 때 함께 뜬다.
    # 1.x(FastMCP)와 2.x(MCPServer) 양쪽을 service._server_factory가 흡수한다.
    "mcp>=1.9",
    "uvicorn>=0.30",
    # 작업 폴더 설정 편집 위젯 (WP-WS) — 별도 저장소를 git URL로 참조한다(main 추적).
    # 서브모듈 편입은 2026-09-20에 걷었다(사용자 확정): 이 저장소는 위젯을 포함하지
    # 않고, 위젯을 함께 고칠 때만 그 저장소를 따로 클론해 editable로 덮어 설치한다.
    "qclaudecodesettingeditorwidget @ git+https://github.com/JuyeongYi/QClaudeCodeSettingEditorWidget.git",
]

[project.scripts]
daedalus = "daedalus.__main__:main"
daedalus-bb = "daedalus.cli.blackboard:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# flat-layout 자동 탐색은 저장소 루트의 project/(실프로젝트 데이터 폴더)를
# 패키지로 오인해 빌드를 거부한다 — 배포 대상은 daedalus 패키지뿐임을 명시.
[tool.setuptools.packages.find]
include = ["daedalus*"]

# 시작 템플릿(A7)은 .py가 아니라 데이터 파일이라 명시하지 않으면 휠에서 빠진다 —
# 그러면 설치본에서만 "템플릿에서 새 프로젝트"가 조용히 실패한다.
[tool.setuptools.package-data]
daedalus = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
